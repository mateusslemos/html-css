<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query 3</title>
    <style>
        /* Declarações gerais */
        
        * {
        padding: 0px;
        margin: 0px;
        font-family: Arial, Helvetica, sans-serif;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: blue;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 0px black;
            padding: 10px;
        }

        /* Declarações retrato */
        @media screen and (orientation: portrait){
            body {
                background: url("../imagens/cev-portrait.jpg") no-repeat fixed center bottom/ cover;
            }
        }

        /* Declarações paisagem */
        @media screen and (orientation: landscape) {
            body {
                background: url("../imagens/cev-landscape.jpg") no-repeat fixed center center/ cover;
            }
        }

    </style>
</head>
<body>
    <h1>Mude a orientação do seu dispositivo</h1>
</body>
</html>
