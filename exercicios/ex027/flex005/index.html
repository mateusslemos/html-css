<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox 5: Centralização</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(219, 171, 108);
        }
        
        main {
            background-color: rgb(78, 77, 150);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-flow: row nowrap;
            height: 100vh;
            width: 100vw;
        }

        section {
            background-color: aqua;
            width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Tela de Login</h1>
        </section>
    </main>
</body>
</html>
