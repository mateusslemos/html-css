<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox 9</title>
    <style>
        div.container {
            display: flex;
            flex-flow: row wrap;
            background-color: chartreuse;
        }

        div.item {
            background-color: aqua;
            text-align: center;
            border: 1px solid black;
            flex-basis: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Texto</div>
        <div class="item">B</div>
        <div class="item">Texto ainda maior</div>
        <div class="item">D</div>
        <div class="item">Conteúdo</div>
        <div class="item">F</div>
    </div>
</body>
</html>
