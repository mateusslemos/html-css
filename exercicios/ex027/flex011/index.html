<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox 11</title>
    <style>
        div.container {
            display: flex;
            flex-flow: row nowrap;
            background-color: chartreuse;
        }

        div.item {
            background-color: aqua;
            text-align: center;
            border: 1px solid black;
        }

        div#caixaA {
            /* flex-grow: 0;
            flex-shrink: 2;
            flex-basis: 250px; */

            flex: 0 2 250px;
        }

        div#caixaB {
            /* flex-grow: 1;
            flex-shrink: 0;
            flex-basis: 250px; */

            flex: 1 0 250px;
        }

        div#caixaC {
            /* flex-grow: 2;
            flex-shrink: 1;
            flex-basis: 250px; */

            flex: 2 1 auto;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="caixaA">A</div>
        <div class="item" id="caixaB">B</div>
        <div class="item" id="caixaC">C</div>
    </div>
</body>
</html>
